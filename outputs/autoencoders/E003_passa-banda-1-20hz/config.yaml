pipeline:
  # Passa-banda 1-20 Hz: mant├®m a banda modal (picos de 4-15.5 Hz) e remove a
  # faixa de 64-128 Hz, que o autoencoder n├úo reconstr├│i e dominava o erro.
  filter_type: "both"
  cutoff_low: 1
  cutoff_high: 20
  sampling_frequency: 256
  axes_to_use: ["X", "Y"]
  nodes_to_use: [10654, 10659, 10664, 10669, 10658, 10663, 10668, 10673]
  fold_strategy: "predefined"
  n_splits: 15

model:
  # Encoder: um bloco Conv1D + MaxPooling1D por item; o decoder ├® o espelho.
  encoder_filters: [32, 32, 16]
  pool_sizes: [4, 4, 2]
  kernel_size: 9
  # Coeficiente L1 de atividade sobre o espa├ºo latente (esparsidade).
  l1_activity: 1.0e-4
  learning_rate: 1.0e-3
  epochs: 200
  batch_size: 32
  validation_split: 0.1
  early_stopping_patience: 10
  # Limiar = m├®dia + k * desvio-padr├úo do erro de reconstru├º├úo no treino saud├ível.
  threshold_k: 1.0
